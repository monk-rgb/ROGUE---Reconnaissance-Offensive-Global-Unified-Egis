    <path d="M610 190L638 218M1310 190L1282 218M610 890L638 862M1310 890L1282 862" stroke-opacity=".5"/>
  </g>
  <g fill="none" stroke="#3dff9a" stroke-width="3" stroke-opacity=".7" filter="url(#glow)">
    <path d="M40 120V40H120M1880 120V40H1800M40 960V1040H120M1880 960V1040H1800"/>
  </g>
  <ellipse cx="960" cy="540" rx="440" ry="170" fill="#1aff8c" opacity=".28" filter="url(#soft-glow)"/>
  <path d="M560 540Q960 250 1360 540Q960 830 560 540Z" fill="#031a11" stroke="#3dff9a" stroke-width="5" filter="url(#glow)"/>
