<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="Emerald tactical eye interface background">
  <defs>
    <radialGradient id="background" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#06261a"/>
      <stop offset="100%" stop-color="#010504"/>
    </radialGradient>
    <radialGradient id="iris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#020807"/>
      <stop offset="38%" stop-color="#03150e"/>
      <stop offset="62%" stop-color="#0b6b3f"/>
      <stop offset="100%" stop-color="#3dff9a"/>
    </radialGradient>
    <radialGradient id="pupil-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b8ffd9"/>
      <stop offset="45%" stop-color="#3dff9a"/>
      <stop offset="100%" stop-color="#3dff9a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
