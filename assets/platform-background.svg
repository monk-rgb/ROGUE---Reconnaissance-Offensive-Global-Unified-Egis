      <circle r="62" fill="none" stroke="#3dff9a" stroke-opacity=".9" stroke-width="3"/>
      <circle r="44" fill="#010403"/>
      <circle r="44" fill="url(#pupil-glow)" opacity=".55"/>
      <circle r="12" fill="#d6ffe9" filter="url(#glow)"/>
      <ellipse cx="50" cy="-48" rx="22" ry="10" fill="#fff" opacity=".35" transform="rotate(-30 50 -48)"/>
    </g>
  </g>
  <g fill="none" stroke="#3dff9a" stroke-width="4" filter="url(#glow)">
    <path d="M810 390V365H835M1110 390V365H1085M810 690V715H835M1110 690V715H1085"/>
