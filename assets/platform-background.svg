      <path d="M570 540H670L700 510H740M570 560H650L680 590H730"/>
      <path d="M1350 540H1250L1220 510H1180M1350 560H1270L1240 590H1190"/>
    </g>
    <g fill="#3dff9a" fill-opacity=".8">
