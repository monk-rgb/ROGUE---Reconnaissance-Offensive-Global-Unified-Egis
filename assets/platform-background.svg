    </pattern>
    <clipPath id="eye-clip">
      <path d="M560 540Q960 250 1360 540Q960 830 560 540Z"/>
    </clipPath>
  </defs>
  <rect width="1920" height="1080" fill="url(#background)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <g fill="none" stroke="#3dff9a" stroke-opacity=".35" stroke-width="2">
